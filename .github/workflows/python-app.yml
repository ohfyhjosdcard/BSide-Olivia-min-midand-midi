name: Build EXE

# 触发条件：当你向 GitHub 推送代码，或者在 GitHub 上打 Tag 时自动运行
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: windows-latest # 在 Windows 环境下打包，确保生成的 exe 兼容 Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 使用 Python 3.10 环境

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mido # 自动安装打包工具和你的依赖库

      - name: Build EXE with PyInstaller
        run: |
          # 核心打包命令：单文件、无控制台黑窗口、注入版本信息
          pyinstaller --onefile --noconsole --version-file=version.txt midi.py 

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MIDI-Fixer-EXE
          path: dist/midi.exe # 打包生成的 exe 文件路径
